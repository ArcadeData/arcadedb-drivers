name: Publish to PyPI

# Manual release only. Nothing in this repository publishes to PyPI on push, tag, or
# schedule - a human triggers this from the Actions UI (or `gh workflow run
# publish-python.yml`) after bumping the chosen package's pyproject.toml "version".
# This workflow is the ONLY place that talks to PyPI.
#
# It publishes ONE package per dispatch, chosen by the `package` input.
#
# Parameterised rather than duplicated into a sibling workflow for the same reason
# publish.yml is: PyPI keys a trusted publisher on the workflow FILENAME, so both
# packages naming this one file means one thing to configure and cross-check instead
# of two. Each package still needs its own trusted publisher.
#
# Unlike npm, PyPI supports PENDING publishers: one can be configured before the
# package exists on the index, so a first publish needs no bootstrap token - which is
# how arcadedb-driver-grpc 0.1.0 reached PyPI.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish. Each dispatch publishes exactly one."
        required: true
        type: choice
        options:
          - driver
          - driver-grpc
      version:
        description: 'Version being published. Must equal the chosen package''s pyproject.toml "version" exactly - this is a guardrail against dispatching the wrong release, not a bump mechanism.'
        required: true
        type: string

permissions:
  contents: read
  # PyPI Trusted Publishing (OIDC) needs a token to attest with; this is the minimum
  # grant that provides one. See the publish step below for the two caveats that
  # cost real debugging time when publish.yml (the npm sibling of this workflow) was
  # set up - one of which does NOT apply here, and one of which does.
  id-token: write

jobs:
  publish:
    name: Publish arcadedb-${{ inputs.package }} to PyPI
    runs-on: ubuntu-latest
    # Every step below addresses the chosen package through these two, never through a
    # literal workspace name - that is what keeps the two packages from drifting apart
    # in what gets verified before a publish.
    env:
      PKG: ${{ inputs.package }}
      PKG_DIR: packages/${{ inputs.package }}
    steps:
      # actions/checkout is pinned to the same commit SHA ci-python.yml uses, never a
      # mutable tag - a tag can be moved after the fact, a SHA cannot.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install dependencies
        working-directory: python
        run: uv sync --frozen

      - name: Verify the dispatch input matches the package version
        working-directory: python
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          uv run python - <<'PY'
          import os, sys, tomllib, pathlib
          pkg_dir = pathlib.Path(os.environ["PKG_DIR"])
          pkg = tomllib.loads((pkg_dir / "pyproject.toml").read_text())
          actual = pkg["project"]["version"]
          requested = os.environ["REQUESTED_VERSION"]
          if actual != requested:
              sys.exit(
                  f'Dispatch input "{requested}" does not match {pkg_dir}/pyproject.toml '
                  f'version "{actual}". Bump the package version first, or dispatch with the correct version.'
              )
          print(f"OK: dispatch input matches {pkg['project']['name']}@{actual}")
          PY

      - name: Run the full unit test suite
        working-directory: python
        run: uv run pytest

      - name: Verify the recorded server version matches the committed contract
        if: ${{ inputs.package == 'driver' }}
        working-directory: python
        # The package records the ArcadeDB release it was generated against in
        # pyproject.toml's [tool.arcadedb] server-version. That must still match the
        # committed contract's info.version at publish time - otherwise the
        # compatibility table this package ships in its README would be lying the
        # moment it is published. The contract file's name carries the version, so
        # it is located by pattern rather than hardcoded, and the check fails loudly
        # if zero or more than one candidate is found.
        #
        # arcadedb-driver ONLY: this reads the OpenAPI contract, which is what
        # arcadedb-driver is generated from - driver-grpc is generated from the .proto
        # and never reads this JSON at all, so gating this on `driver` (rather than
        # running it unconditionally) is what keeps a proto-only contract bump from
        # blocking a driver-grpc publish on an OpenAPI contract it does not depend on.
        # The step below is driver-grpc's own equivalent gate, on its own contract.
        run: |
          uv run python - <<'PY'
          import json, os, pathlib, sys, tomllib
          contracts = pathlib.Path("../contracts")
          candidates = sorted(contracts.glob("arcadedb-openapi-*.json"))
          if len(candidates) != 1:
              sys.exit(f"Expected exactly one contracts/arcadedb-openapi-*.json, found {len(candidates)}")
          pkg_dir = pathlib.Path(os.environ["PKG_DIR"])
          pkg = tomllib.loads((pkg_dir / "pyproject.toml").read_text())
          pkg_version = pkg.get("tool", {}).get("arcadedb", {}).get("server-version")
          contract_version = json.loads(candidates[0].read_text()).get("info", {}).get("version")
          if not pkg_version or not contract_version:
              sys.exit(f'Missing version field(s): server-version="{pkg_version}", info.version="{contract_version}"')
          if pkg_version != contract_version:
              sys.exit(
                  f'{pkg_dir}/pyproject.toml [tool.arcadedb] server-version ("{pkg_version}") does not match '
                  f'{candidates[0].name}\'s info.version ("{contract_version}")'
              )
          print(f"OK: server-version matches contract info.version ({pkg_version})")
          PY

      - name: Verify the committed .proto contract matches the recorded server version
        if: ${{ inputs.package == 'driver-grpc' }}
        working-directory: python
        # The step above compares server-version against the OPENAPI contract's
        # info.version, gated to `driver` only - the right source for arcadedb-driver,
        # which is generated from it, but only indirect evidence for
        # arcadedb-driver-grpc, which is generated from the .proto and never reads that
        # JSON at all. The two agree today only because adopt-contract-version.sh
        # stamps every package from one argument; fetch-contract.sh has independent
        # --release/--image (OpenAPI) and --proto-from (proto) modes, so the two
        # contracts CAN be fetched apart and left disagreeing, and nothing else here
        # would notice. This workflow is the only irreversible one in the repository -
        # a wrong publish cannot be taken back - so the gRPC package gets its own gate
        # on its own contract here, gated to `driver-grpc`, rather than inheriting the
        # JSON one or blocking on a contract it does not depend on.
        #
        # resolve-proto-contract.sh already refuses zero or two matches, which is the
        # other half of the check: a version bump transiently leaves two contracts side
        # by side, and a glob resolves those in LEXICAL order - 26.9.1 before 26.9.2, the
        # stale one. All this step adds is comparing the surviving file's filename version
        # against what the package recorded.
        run: |
          PROTO="$(../scripts/resolve-proto-contract.sh)"
          export PROTO
          uv run python - <<'PY'
          import os, pathlib, sys, tomllib
          proto = pathlib.Path(os.environ["PROTO"])
          proto_version = proto.name.removeprefix("arcadedb-server-").removesuffix(".proto")
          pkg_dir = pathlib.Path(os.environ["PKG_DIR"])
          pkg = tomllib.loads((pkg_dir / "pyproject.toml").read_text())
          pkg_version = pkg.get("tool", {}).get("arcadedb", {}).get("server-version")
          if not proto_version or not pkg_version:
              sys.exit(f'Missing version(s): proto filename="{proto.name}", server-version="{pkg_version}"')
          if proto_version != pkg_version:
              sys.exit(
                  f'{pkg_dir}/pyproject.toml [tool.arcadedb] server-version ("{pkg_version}") does not match '
                  f'the committed contract {proto.name} ("{proto_version}"). Run '
                  f"scripts/adopt-contract-version.sh so both contracts and every package agree."
              )
          print(f"OK: {proto.name} matches server-version ({pkg_version})")
          PY

      - name: Build the wheel and sdist, and verify their contents
        working-directory: python
        # Asserting the built artifacts actually contain the generated tree and the
        # typing marker turns a silent no-op build into a hard CI failure instead of
        # an empty published package - the same guard publish.yml applies to dist/.
        #
        # The two packages need different required-entry lists, which is why this is
        # a script and not one shared list - the same shape publish.yml's npm sibling
        # takes for the same reason. driver-grpc's generated modules are checked
        # separately, in the step below, because their names are constant (see that
        # step's comment) and so need no per-package branching here.
        run: |
          DIST_NAME="arcadedb_${PKG//-/_}"
          uv build --package "arcadedb-$PKG" --out-dir dist
          WHEEL="$(ls dist/"$DIST_NAME"-*.whl)"

          if [[ "$PKG" == "driver-grpc" ]]; then
            REQUIRED=(
              "arcadedb_driver_grpc/__init__.py"
              "arcadedb_driver_grpc/py.typed"
            )
          else
            REQUIRED=(
              "arcadedb_driver/__init__.py"
              "arcadedb_driver/py.typed"
              "arcadedb_driver/_generated/client.py"
              "arcadedb_driver/_generated/api/query/execute_query_post.py"
            )
          fi

          for entry in "${REQUIRED[@]}"; do
            unzip -l "$WHEEL" | grep -q "$entry" \
              || { echo "$entry is missing from $WHEEL - the published package would be broken" >&2; exit 1; }
          done
          ls dist/"$DIST_NAME"-*.tar.gz >/dev/null

      - name: Verify the gRPC generated modules are in the wheel
        if: ${{ inputs.package == 'driver-grpc' }}
        working-directory: python
        # Simpler than publish.yml's dist assertion for driver-grpc, which derives the expected
        # filename from arcadedb.serverVersion because its generated module is version-stamped.
        # This one is not: generate-grpc.sh normalises the proto filename, so these names are
        # constant and a regenerate overwrites rather than accumulates. The stale-module hazard
        # npm's derived-name check exists to catch cannot occur here.
        #
        # Two things differ here from the exact command this step started from, both
        # found by actually building a wheel and running it rather than trusting it:
        #   - no trailing `$` on the pattern: `python -m zipfile -l` lists
        #     "name  mtime  size" per line, not a bare filename, so anchoring at
        #     end-of-line finds zero matches against a real wheel;
        #   - `dist/"$DIST_NAME"-*.whl`, not a bare `dist/*.whl`: `zipfile -l` accepts
        #     exactly one archive argument, so a bare glob breaks the moment more than
        #     one wheel sits in dist/ (harmless here, since this job builds only one
        #     package, but the pinned glob costs nothing and removes the assumption).
        run: |
          DIST_NAME="arcadedb_${PKG//-/_}"
          # `|| true` is load-bearing: `grep -c` exits 1 when it matches nothing, and
          # under `set -e` (which the shell runs with) that aborts the assignment - so the
          # zero-match case, the one the diagnostic below exists for, would kill the step
          # before it could print anything. With `|| true` the count is 0 and the `if`
          # below reports it properly.
          COUNT="$(uv run python -m zipfile -l dist/"$DIST_NAME"-*.whl | grep -cE 'arcadedb_server_pb2(_grpc)?\.(py|pyi)' || true)"
          if [[ "$COUNT" -ne 4 ]]; then
            echo "Expected 4 generated gRPC files (arcadedb_server_pb2.py/.pyi, arcadedb_server_pb2_grpc.py/.pyi) in the wheel, found $COUNT:" >&2
            uv run python -m zipfile -l dist/"$DIST_NAME"-*.whl | grep -E 'arcadedb_server_pb2(_grpc)?\.(py|pyi)' >&2
            exit 1
          fi
          echo "OK: found all 4 generated gRPC files in the wheel"

      # Two caveats recorded here, mirroring the ones publish.yml (npm) records at its
      # own publish step - one INVERTS, one carries over unchanged:
      #
      # 1. This INVERTS npm's bootstrap problem. npm's trusted-publisher configuration
      #    attaches to an EXISTING package, so the first publish of @arcadedb/driver
      #    (or @arcadedb/driver-grpc) may need a short-lived token before a trusted
      #    publisher can even be configured. PyPI instead supports PENDING publishers: a
      #    trusted publisher for a project can be configured on PyPI before the project
      #    exists there at all. So the first publish of EITHER package here - including
      #    arcadedb-driver-grpc, whose 0.1.0 went out exactly this way - needs no bootstrap
      #    token and no stored secret, ever; every run, including the first, authenticates
      #    purely via the id-token permission above. This is per package, same as npm:
      #    arcadedb-driver's trusted publisher configuration does nothing for
      #    arcadedb-driver-grpc's, but neither needs a bootstrap step either way.
      #
      # 2. This carries over unchanged. PyPI, like npm, does NOT validate a
      #    trusted-publisher configuration when it is saved - it will accept a
      #    workflow filename that does not exist, or that does not match this file's
      #    actual name, with no error at configuration time. A mismatch surfaces only
      #    later, as a failed publish. So: whenever this file is renamed, or a trusted
      #    publisher is (re)configured, check the workflow filename entered in PyPI's
      #    publisher settings against this file's actual name (currently
      #    `publish-python.yml`) once, deliberately - side by side, not from memory.
      #    Both packages name this same file, which is the whole reason the `package`
      #    input exists instead of a second workflow.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist
          attestations: true
