name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@19dda84776b3518d98b8798e591daee763049ed3 # v1.0.220
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            This repository generates language clients from the contracts in `contracts/`, so
            also check the rules that are specific to it:
            - Generated code is never hand-edited. A diff that edits generated output instead
              of the contract or the generator config will fail CI's drift gate; say so.
            - `contracts/` holds exactly one OpenAPI JSON and exactly one `.proto`. A PR that
              leaves two of either behind is broken even if CI is green on this run.
            - The READMEs and code comments document failure modes and deliberate asymmetries
              on purpose. Behaviour changes in those areas should update that prose with them.

            Use the repository's CLAUDE.md - and the per-workspace `typescript/CLAUDE.md` and
            `python/CLAUDE.md` - for guidance on style and conventions. Be constructive and
            helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--model claude-sonnet-5 --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
