name: Publish to npm
run-name: Publish @arcadedb/${{ inputs.package }} ${{ inputs.version }}

# Manual release only. Nothing in this repository publishes to npm on push, tag, or schedule.
# release.yml dispatches this workflow once per package, after its own lockstep check and dry run.
# Dispatching it by hand (the Actions UI, or `gh workflow run publish.yml`) is for recovering a
# partial release - say one package published and the other did not - and it BYPASSES the lockstep
# check, so the versions being published are then the operator's responsibility. It must run AT
# THE TAG - the first step refuses any other ref, and both the UI and `gh workflow run` default to
# `main` - so recover with exactly:
#
#   gh workflow run publish.yml --ref v<version> -f package=<pkg> -f version=<version>
#
# where <pkg> is driver or driver-grpc.
#
# This workflow is the ONLY place that talks to the npm registry.
#
# It publishes ONE package per dispatch, chosen by the `package` input. That input is why this
# file is parameterised rather than duplicated into a sibling workflow: npm keys a trusted
# publisher on (org, repo, workflow FILENAME, environment), so every package published from here
# names this one filename in its own npm settings. A second workflow file would mean a second
# filename to configure and cross-check by hand - and per caveat 2 below, npm validates neither.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish. Each dispatch publishes exactly one."
        required: true
        type: choice
        options:
          - driver
          - driver-grpc
      version:
        description: 'Version being published. Must equal the chosen packages/<package>/package.json "version" exactly - this is a guardrail against dispatching the wrong release, not a bump mechanism.'
        required: true
        type: string

permissions:
  contents: read
  # npm's trusted-publisher (OIDC) flow needs a token to attest with; this is the minimum grant
  # that provides one. See the provenance step below for the two caveats that cost real debugging
  # time when this was set up.
  id-token: write

jobs:
  publish:
    name: Publish @arcadedb/${{ inputs.package }} to npm
    runs-on: ubuntu-latest
    # Every step below addresses the chosen package through these two, never through a literal
    # workspace name, so the two packages cannot drift apart in what gets published.
    env:
      PKG: ${{ inputs.package }}
      PKG_DIR: packages/${{ inputs.package }}
    steps:
      # A version is published only from its own tag. The Actions UI and `gh workflow run` both
      # default to `main`, and a hand dispatch left on that default would build and publish
      # whatever main holds today under a version that was tagged, and verified, on another commit.
      # release.yml always dispatches with ref=v<version>, so this only ever refuses a hand dispatch
      # on the wrong ref. First, before checkout, so a refused run builds nothing. Both values reach
      # the shell through the environment: `version` is free text typed by whoever dispatches.
      - name: Refuse unless dispatched on the tag v<version>
        env:
          REF: ${{ github.ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF" != "refs/tags/v$REQUESTED_VERSION" ]; then
            echo "::error::Dispatched on $REF, not refs/tags/v$REQUESTED_VERSION. Publish only from the version's tag: gh workflow run publish.yml --ref v$REQUESTED_VERSION -f package=$PKG -f version=$REQUESTED_VERSION"
            exit 1
          fi
          echo "OK: dispatched on $REF"

      # actions/checkout is pinned to the same commit SHA ci.yml uses, never a mutable tag - a tag
      # can be moved after the fact, a SHA cannot.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      - name: Verify the dispatch input matches the package version
        working-directory: typescript
        run: |
          node -e '
            const dir = process.env.PKG_DIR;
            const pkg = require(`./${dir}/package.json`);
            const requested = process.env.REQUESTED_VERSION;
            if (pkg.version !== requested) {
              console.error(`Dispatch input "${requested}" does not match ${dir}/package.json version "${pkg.version}". Bump the package version first, or dispatch with the correct version.`);
              process.exit(1);
            }
            console.log(`OK: dispatch input matches ${pkg.name}@${pkg.version}`);
          '
        env:
          REQUESTED_VERSION: ${{ inputs.version }}

      # The pre-publish gates (unit tests, recorded server version vs the committed contract, the
      # prepack build and its dist/ assertions) live in scripts/release/verify-npm.sh, so that
      # release.yml's dry run runs the very same checks and the two can never diverge. Their
      # explanatory comments live there, next to the code they explain.
      - name: Verify the package before publishing
        run: ./scripts/release/verify-npm.sh "$PKG"

      # Trusted publishing (OIDC) needs npm >= 11.5.1, and Node 20 - kept above as the declared
      # floor the package is built and tested on - ships npm 10. npm 10 never attempts OIDC: it
      # signs the provenance statement (that uses the id-token too, so the log looks healthy) and
      # then authenticates with NODE_AUTH_TOKEN alone. That is how 0.2.0 failed: E404 on the PUT
      # with the expired bootstrap token, then EOTP with a fresh token lacking 2FA bypass, and it
      # shipped only on a short-lived bypass token. npm 11 tries OIDC first and falls back to
      # NODE_AUTH_TOKEN only when no trusted publisher matches, so with the NPM_TOKEN secret
      # deleted, OIDC is the only way this step can authenticate. Pinned exactly, like the actions.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install --global npm@11.19.1
          actual=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$actual" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $actual cannot do trusted publishing; it needs >= 11.5.1."
            exit 1
          fi
          echo "OK: npm $actual"

      # Two caveats recorded here because both cost real debugging time when this workflow was set
      # up, and neither is discoverable by reading npm's docs in the moment:
      #
      # 1. A trusted publisher can only be configured for a package that ALREADY EXISTS on the
      #    registry - npm has no equivalent of PyPI's pending publishers, and `npm trust` does not
      #    change that ("the package you're configuring must already exist"). So the FIRST publish
      #    of each package here needs a short-lived, granular-scoped npm token (set as the
      #    NPM_TOKEN secret below, NODE_AUTH_TOKEN in the environment) to create the package at
      #    all; afterwards the trusted publisher takes over and the secret goes away. Note there is
      #    no non-expiring token to fall back on: npm removed legacy tokens in November 2025, and
      #    every granular token must carry an expiry. One day is the minimum, and enough. If the
      #    account enforces 2FA for publishing, the token must also have "Bypass two-factor
      #    authentication" ticked, or the publish fails with EOTP. Delete the secret (and revoke
      #    the token) once the publish is done: an empty NODE_AUTH_TOKEN is what keeps OIDC the
      #    only path.
      #
      #    This bootstrap is PER PACKAGE, not per workflow: @arcadedb/driver having a trusted
      #    publisher does nothing for @arcadedb/driver-grpc. A scope-level token covers both.
      #
      # 2. npm does NOT validate a trusted-publisher configuration when it is saved - it will accept
      #    a workflow filename that does not exist, or that does not match this file's actual name,
      #    with no error at configuration time. A mismatch surfaces only later, as a failed publish.
      #    Do not check this by eye against npm's web UI; read back what npm actually stored
      #    (npm >= 11.15.0, and it needs an interactive 2FA login - a token that bypasses 2FA is
      #    refused):
      #
      #      npm trust list @arcadedb/driver
      #      npm trust list @arcadedb/driver-grpc
      #
      #    `file:` must read `publish.yml`, `repository:` must read ArcadeData/arcadedb-drivers,
      #    and NO environment may be set, because no job here declares one. Re-read it whenever
      #    this file is renamed or a publisher is reconfigured. Both packages name this same file,
      #    which is the whole reason the `package` input exists instead of a second workflow - one
      #    filename to get right rather than two. To (re)create one:
      #
      #      npm trust github <package> --file publish.yml \
      #        --repo ArcadeData/arcadedb-drivers --allow-publish
      - name: Publish to npm with provenance
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace "$PKG_DIR" --access public --provenance
